<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SafeReport</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="phone" id="phone">
  <div class="status" aria-hidden="true"><span id="clock">9:41</span><i class="island"></i>
    <svg viewBox="0 0 66 14" fill="currentColor"><rect x="0" y="9" width="3" height="5" rx="1"/><rect x="5" y="6" width="3" height="8" rx="1"/><rect x="10" y="3" width="3" height="11" rx="1"/><rect x="15" y="0" width="3" height="14" rx="1"/><path d="M30 3.2a9 9 0 0112 0l-1.5 1.6a6.8 6.8 0 00-9 0zM32.6 6.4a5.2 5.2 0 016.8 0L38 8a3 3 0 00-4 0zM36 10a1.4 1.4 0 110 2.8A1.4 1.4 0 0136 10z"/><rect x="46" y="1" width="19" height="11" rx="3.2" fill="none" stroke="currentColor" stroke-opacity=".45"/><rect x="48" y="3" width="15" height="7" rx="1.8"/></svg></div>
  <div class="home-bar" aria-hidden="true"></div>
  <div class="notif" id="notif" hidden></div>
  <main id="screen" class="screen"></main>
  <nav id="progress" class="progress" aria-label="Report progress" hidden></nav>
</div>
<input type="file" id="fileCamera" accept="image/*" capture="environment" hidden>
<input type="file" id="fileUpload" accept="image/*" hidden>
<script src="app.js"></script>
</body>
</html>
